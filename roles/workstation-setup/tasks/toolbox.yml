- name: Create toolbox dir
  file:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/share/JetBrains/Toolbox/bin"
    state: directory    

- name: Download JetBrains Toolbox
  get_url:
    url: "https://download.jetbrains.com/toolbox/jetbrains-toolbox-{{ jetbrains_toolbox_version }}.tar.gz"
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/share/JetBrains/Toolbox/bin/jetbrains-toolbox-{{ jetbrains_toolbox_version }}.tar.gz"
    checksum: "sha256:{{ jetbrains_toolbox_sha256 }}"
    mode: "0644"

- name: Install JetBrains Toolbox
  unarchive:
    src: "{{ ansible_facts['env']['HOME'] }}/.local/share/JetBrains/Toolbox/bin/jetbrains-toolbox-{{ jetbrains_toolbox_version }}.tar.gz"
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/share/JetBrains/Toolbox/bin"
    extra_opts: [--strip-components=1]
    remote_src: yes
    creates: "{{ ansible_facts['env']['HOME'] }}/.local/share/JetBrains/Toolbox/bin/jetbrains-toolbox"

- name: Install desktop file for toolbox
  template:
    src: jetbrains-toolbox.desktop.j2
    dest: "{{ansible_facts['env']['HOME']}}/.local/share/applications/jetbrains-toolbox.desktop"
