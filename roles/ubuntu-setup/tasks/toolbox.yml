- name: Create toolbox dir
  file:
    path: "{{ ansible_env.HOME }}/.local/share/JetBrains/Toolbox/bin"
    state: directory    

- name: Install jetbrains toolbox
  unarchive:
    src: "https://download.jetbrains.com/toolbox/jetbrains-toolbox-{{ jetbrains_toolbox_version }}.tar.gz"
    dest: "{{ ansible_env.HOME }}/.local/share/JetBrains/Toolbox/bin"
    extra_opts: [--strip-components=1]
    remote_src: yes
    creates: "{{ ansible_env.HOME }}/.local/share/JetBrains/Toolbox/bin/jetbrains-toolbox"

- name: Install desktop file for toolbox
  template:
    src: jetbrains-toolbox.desktop.j2
    dest: "{{ansible_env.HOME}}/.local/share/applications/jetbrains-toolbox.desktop"
    