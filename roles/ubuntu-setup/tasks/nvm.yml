---

- name: Install NVM with brew
  homebrew:
    name: nvm
    path: /home/linuxbrew/.linuxbrew/bin
    state: present

- name: Create NVM folder
  file:
    path: "{{ ansible_env.HOME }}/.nvm"
    state: directory

- name: Install node
  shell: source "{{ linuxbrew_path }}/opt/nvm/nvm.sh" && nvm install lts/*
  args:
    executable: /bin/bash
    creates: "{{ ansible_env.HOME }}/.nvm/alias/default"
  environment:
    NVM_DIR: "{{ ansible_env.HOME }}/.nvm"