---

- name: Install aptitude
  apt: 
    name: aptitude
    state: present
  become: yes

- name: Install system packages
  apt:
    name:
      - build-essential
      - chrome-gnome-shell
      - cmake
      - curl
      - deja-dup
      - git
      - gnupg2
      - guake
      - libcurl4-openssl-dev
      - libcurl4-openssl-dev
      - libffi-dev
      - libreadline-dev
      - libsqlite3-dev
      - libssl-dev
      - libssl-dev
      - libxml2
      - libxml2-dev
      - libxml2-dev
      - libxslt1-dev
      - libyaml-dev
      - openssl
      - pinentry-curses
      - python
      - python-dev
      - python-pip
      - python3
      - python3-dev
      - python3-pip
      - software-properties-common
      - sqlite3
      - unzip
      - ubuntu-restricted-extras
      - xautomation
      - xclip
      - zip
      - zlib1g-dev
      - zsh
    state: present
  become: yes
  notify: Update and upgrade apt packages