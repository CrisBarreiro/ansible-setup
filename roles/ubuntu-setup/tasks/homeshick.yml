---

- name: Install homeshick with brew
  homebrew:
    name: homeshick
    path: /home/linuxbrew/.linuxbrew/bin
    state: present

- name: Clone base homeshick repo
  git: 
    repo: "{{ homesick_repo }}"
    dest: "{{ ansible_env.HOME }}/.homesick/repos/{{ homesick_castle_name }}"
    accept_hostkey: yes

- name: Link base homeshick repo
  shell: "{{ linuxbrew_bin_path }}/homeshick link {{ homesick_castle_name }} -f"
  args:
    creates: "{{ ansible_env.HOME }}/.hsh-linked"