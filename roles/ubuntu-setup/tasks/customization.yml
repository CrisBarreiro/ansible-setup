---

- name: Install prerequisites
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg2
      - software-properties-common
    state: present
  become: yes

- name: Add repositories
  apt_repository:
    repo: "{{ item }}"
    state: present
  become: yes
  loop:
    - ppa:snwh/pulp

- name: Install customization packages
  apt:
    name:
      - arc-theme
      - gnome-themes-standard
      - gnome-tweak-tool
      - gtk2-engines-murrine
      - paper-icon-theme
    state: present
    update_cache: yes
  become: yes