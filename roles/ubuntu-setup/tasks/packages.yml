---

- name: Update apt cache
  apt:
    update_cache: yes
  become: yes
  
- name: Install aptitude
  apt: 
    name: aptitude
    state: present
  become: yes

- name: Upgrade apt packages
  apt:
    upgrade: safe
  become: yes

- name: Install system packages
  apt:
    name:
      - build-essential
      - cmake
      - curl
      - git
      - git-core
      - gnupg2
      - libcurl4-openssl-dev
      - libcurl4-openssl-dev
      - libffi-dev
      - libreadline-dev
      - libsqlite3-dev
      - libssl-dev
      - libssl-dev
      - libxml2
      - libxml2-dev
      - libxml2-dev
      - libxslt1-dev
      - libyaml-dev
      - openssl
      - pinentry-curses
      - python
      - python-dev
      - python-pip
      - python3
      - python3-dev
      - python3-pip
      - software-properties-common
      - sqlite3
      - unzip
      - xautomation
      - xclip
      - zip
      - zlib1g-dev
      - zsh
    state: present
    update_cache: yes
  become: yes