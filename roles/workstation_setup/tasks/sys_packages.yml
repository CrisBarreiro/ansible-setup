---

- name: Install aptitude
  ansible.builtin.apt:
    name: aptitude
    state: present
  become: true

- name: Install system packages
  ansible.builtin.apt:
    name:
      - android-tools-adb
      - build-essential
      - cmake
      - curl
      - deja-dup
      - git
      - gnupg2
      - libcurl4-openssl-dev
      - libffi-dev
      - libreadline-dev
      - libsqlite3-dev
      - libssl-dev
      - libxml2
      - libxml2-dev
      - libxslt1-dev
      - libyaml-dev
      - network-manager-openvpn
      - openssl
      - pavucontrol
      - pinentry-curses
      - python3
      - python3-dev
      - python3-pip
      - qemu-kvm
      - software-properties-common
      - sqlite3
      - unzip
      - ubuntu-restricted-extras
      - xautomation
      - xclip
      - zip
      - zlib1g-dev
      - zsh
    state: present
  become: true
  notify: Update and upgrade apt packages
