---
- name: Download the Herdr installer
  ansible.builtin.get_url:
    url: https://releases.herdr.dev/app/install.sh
    dest: /tmp/herdr-install.sh
    mode: "0755"

- name: Install Herdr
  ansible.builtin.command: /bin/sh /tmp/herdr-install.sh
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/.local/bin/herdr"
  environment:
    HOME: "{{ ansible_facts['env']['HOME'] }}"

- name: Remove the Herdr installer
  ansible.builtin.file:
    path: /tmp/herdr-install.sh
    state: absent
